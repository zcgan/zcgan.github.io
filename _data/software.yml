- name: StochasticHydroTools
  category: research
  purpose: Shared research software for stochastic hydrodynamics and confined-flow calculations, including a branch that solves a surface PDE for a surface flow field imposed as a slip boundary condition.
  links:
    - label: GitHub organization
      url: "https://github.com/stochasticHydroTools"
    - label: Surface-PDE development branch
      url: "https://github.com/JohnsonYang0629/RigidMultiblobsWall_BiBeltrami"
  status: Active public organization; individual repositories provide their own licences and documentation.
- name: TABI-P
  category: research
  purpose: Boundary-integral Poisson solver for dielectric bodies, with treecode acceleration in the original method.
  links:
    - label: GitHub repository
      url: "https://github.com/zcgan/TABI-P-nd"
    - label: Treecodes GitHub organization
      url: "https://github.com/Treecodes"
  status: Public research code; consult the repository for setup and maintenance details.
- name: HybridMD
  category: research
  purpose: Molecular-dynamics code for closely packed dielectric spheres using a hybrid electrostatic solver.
  url: "https://github.com/zcgan/HybridMD"
  link_label: GitHub repository
  status: Public legacy code under GPL-3.0; the repository documentation is limited.
- name: ExTinyMD
  category: research
  purpose: Compact Julia package for molecular-dynamics simulations, with an example workflow for a three-dimensional Lennard-Jones fluid.
  links:
    - label: GitHub repository
      url: "https://github.com/HPMolSim/ExTinyMD.jl"
    - label: HPMolSim GitHub organization
      url: "https://github.com/HPMolSim"
  status: Public Julia package under the MIT License; the README includes installation instructions and an example workflow.
- name: SolarLab
  category: research
  purpose: Thin-film solar-cell simulator for one-dimensional drift-diffusion, Poisson, mobile-ion, and transfer-matrix-optics calculations, with an experimental two-dimensional extension.
  url: "https://github.com/ShaneLogic/SolarLab"
  link_label: GitHub repository
  status: Public repository with installation, numerical-method, validation, and model-scope documentation.
- name: LSR-Net data repository
  category: research
  purpose: Data and supporting material for long-short-range operator-learning studies.
  url: "https://github.com/zcgan/LSR-Net-DataRepo"
  link_label: GitHub repository
  status: Public research data repository.
- name: LAMMPS electrostatics contribution
  category: adoption
  purpose: Quasi-2D electrostatic error analysis used for automatic slab-size selection in Ewald and PPPM simulations.
  url: "https://github.com/lammps/lammps/pull/4939"
  link_label: LAMMPS PR #4939
  status: Merged into the LAMMPS development record through pull request #4939.
