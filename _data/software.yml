- name: SolarLab
  category: research
  purpose: Thin-film solar-cell simulator for one-dimensional drift–diffusion, Poisson, mobile-ion transport, and transfer-matrix optical modeling, with an experimental two-dimensional extension.
  url: "https://github.com/ShaneLogic/SolarLab"
  link_label: GitHub repository
  status: Public repository with installation, numerical-method, validation, and model-scope documentation.
- name: LSR-Net code and data repository
  category: research
  purpose: Code, data, and supporting material for long-short-range operator-learning studies.
  url: "https://github.com/zcgan/LSR-Net-DataRepo"
  link_label: GitHub repository
  status: Public research code and data repository.
- name: ExTinyMD
  category: research
  purpose: Compact Julia package for molecular-dynamics simulations within HPMolSim, which also hosts group-developed fast algorithms for force-field and electrostatic calculations.
  links:
    - label: GitHub repository
      url: "https://github.com/HPMolSim/ExTinyMD.jl"
    - label: HPMolSim GitHub organization
      url: "https://github.com/HPMolSim"
  status: Public Julia package under the MIT License; the README includes installation instructions and an example workflow.
- name: StochasticHydroTools
  category: research
  purpose: Shared research software for stochastic hydrodynamics and confined-flow simulations, including surface PDE solvers for computing slip velocity fields on confining interfaces.
  links:
    - label: GitHub organization
      url: "https://github.com/stochasticHydroTools"
    - label: Surface-PDE development branch
      url: "https://github.com/JohnsonYang0629/RigidMultiblobsWall_BiBeltrami"
  status: Active public organization; individual repositories provide their own licences and documentation.
- name: TABI-P
  category: research
  purpose: Boundary-integral Poisson solver for dielectric bodies with treecode acceleration.
  links:
    - label: GitHub repository
      url: "https://github.com/zcgan/TABI-P-nd"
    - label: Treecodes GitHub organization
      url: "https://github.com/Treecodes"
  status: Public research code; consult the repository for setup and maintenance details.
- name: HybridMD
  category: research
  purpose: Molecular-dynamics code for closely packed dielectric spheres using a hybrid electrostatic solver.
  url: "https://github.com/zcgan/HybridMD"
  link_label: GitHub repository
  status: Publicly available research code released under GPL-3.0.
- name: LAMMPS official adoption of our quasi-2D error estimates
  category: adoption
  purpose: Our quasi-2D electrostatic error estimates have been integrated into LAMMPS, enabling automatic selection of the extended z dimension for slab-corrected Ewald and PPPM simulations.
  links:
    - label: LAMMPS documentation
      url: "https://docs.lammps.org/kspace_modify.html"
    - label: LAMMPS PR #4939
      url: "https://github.com/lammps/lammps/pull/4939"
  status: Available in the official 4Jul2026 release through kspace_modify slab auto; the LAMMPS documentation describes the method and cites Gao et al. (2025) and Gan et al. (2025).
